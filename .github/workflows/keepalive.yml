name: Keepalive

on:
  schedule:
    # Monthly, comfortably inside the 60-day window. This workflow exists only to
    # stop GitHub disabling the other two: scheduled workflows in a public repo are
    # switched off automatically after 60 days without repository activity, and a
    # monitor that quietly stops monitoring is worse than no monitor.
    - cron: '41 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Full history: pushing from a shallow clone is avoidable trouble, and this
      # repo is small.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push an empty commit to the keepalive branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # An orphan branch rather than main. A push is repository activity either
          # way, but main's history stays readable for anyone reviewing the repo.
          if git ls-remote --exit-code --heads origin keepalive >/dev/null 2>&1; then
            git fetch origin keepalive
            git checkout -B keepalive origin/keepalive
          else
            echo "Creating the keepalive branch for the first time."
            git checkout --orphan keepalive
            # Not --cached: that would leave every site file sitting untracked in the
            # working tree, and the next checkout of this branch then refuses to
            # overwrite them. Clear the index and the working tree together.
            git rm -rf . >/dev/null
            cat > README.md <<'EOF'
          # keepalive

          This branch exists for one reason: GitHub disables scheduled workflows in a
          public repository after 60 days without repository activity, which would
          silently switch off the uptime and link-check monitors on `main`.

          `.github/workflows/keepalive.yml` pushes an empty commit here once a month so
          that never happens. Nothing here is part of the site, and nothing on `main`
          depends on it. It is safe to ignore.
          EOF
            git add README.md
            git commit -q -m "Add keepalive branch"
          fi

          git commit -q --allow-empty -m "Keep scheduled workflows enabled ($(date -u +%Y-%m-%d))"
          git push origin keepalive

          echo "Pushed. Latest commits on keepalive:"
          git log --oneline -3
