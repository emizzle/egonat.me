name: Workflow Keepalive

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Import GPG key
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          SIGNING_KEY=$(gpg --list-secret-keys --keyid-format long | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo -n "$GPG_PASSPHRASE" > /tmp/gpg-passphrase
          chmod 600 /tmp/gpg-passphrase
          cat > ~/gpg-wrapper.sh <<-'WRAPPER'
          #!/bin/bash
          exec gpg --batch --pinentry-mode loopback --passphrase-file /tmp/gpg-passphrase "$@"
          WRAPPER
          chmod +x ~/gpg-wrapper.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282@users.noreply.github.com"
          git config commit.gpgsign true
          git config user.signingkey "$SIGNING_KEY"
          git config gpg.program ~/gpg-wrapper.sh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Push signed empty commit
        run: |
          git commit --allow-empty -m "chore: workflow keepalive — prevent activity-based disabling"
          git push
